name: Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag_name:
        description: Existing release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check version consistency
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          make check-version
          SOURCE_VERSION="$(make --no-print-directory version)"
          if [[ "$RELEASE_TAG" != "v$SOURCE_VERSION" ]]; then
            echo "release tag $RELEASE_TAG does not match source version v$SOURCE_VERSION" >&2
            exit 1
          fi

      - name: Format check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l *.go cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        shell: bash
        run: |
          MODULE="$(go list -m)"
          go build -trimpath \
            -ldflags "-X ${MODULE}/internal/commands.defaultUpdateRepo=${GITHUB_REPOSITORY}" \
            -o goskill \
            .

  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff check
        run: python -m ruff check setup.py src

      - name: Ruff format check
        run: python -m ruff format --check setup.py src

  release-linux:
    name: Release artifacts (Linux)
    runs-on: ubuntu-latest
    needs: [go, python]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build Linux binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${RELEASE_TAG#v}"
          MODULE="$(go list -m)"
          for GOARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
              go build -trimpath \
                -ldflags "-s -w -X ${MODULE}/internal/buildinfo.Version=${VERSION} -X ${MODULE}/internal/commands.defaultUpdateRepo=${GITHUB_REPOSITORY}" \
                -o "dist/goskill-linux-${GOARCH}" \
                .
          done

      - name: Build Linux wheel
        run: python -m build --wheel

      - name: Check wheel metadata
        run: python -m twine check dist/*.whl

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
          .venv-smoke/bin/goskill --version

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: dist/*
          if-no-files-found: error

  release-macos:
    name: Release artifacts (macOS)
    runs-on: macos-latest
    needs: [go, python]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build macOS binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${RELEASE_TAG#v}"
          MODULE="$(go list -m)"
          for GOARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="${GOARCH}" \
              go build -trimpath \
                -ldflags "-s -w -X ${MODULE}/internal/buildinfo.Version=${VERSION} -X ${MODULE}/internal/commands.defaultUpdateRepo=${GITHUB_REPOSITORY}" \
                -o "dist/goskill-darwin-${GOARCH}" \
                .
          done

      - name: Build macOS wheel
        run: python -m build --wheel

      - name: Check wheel metadata
        run: python -m twine check dist/*.whl

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
          .venv-smoke/bin/goskill --version

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist/*
          if-no-files-found: error

  release-windows:
    name: Release artifacts (Windows)
    runs-on: windows-latest
    needs: [go, python]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build Windows binary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = $env:RELEASE_TAG -replace '^v', ''
          $module = go list -m
          $ldflags = "-s -w -X $module/internal/buildinfo.Version=$version -X $module/internal/commands.defaultUpdateRepo=$env:GITHUB_REPOSITORY"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "$ldflags" -o "dist/goskill-windows-amd64.exe" .

      - name: Build Windows wheel
        run: python -m build --wheel

      - name: Check wheel metadata
        shell: pwsh
        run: |
          $wheels = Get-ChildItem dist/*.whl
          python -m twine check @($wheels.FullName)

      - name: Smoke test wheel
        shell: pwsh
        run: |
          python -m venv .venv-smoke
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          .venv-smoke/Scripts/python -m pip install $wheel
          .venv-smoke/Scripts/goskill --version

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-linux, release-macos, release-windows]
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: dist
          merge-multiple: true

      - name: Upload artifacts to release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  # PyPI publishing remains opt-in. Add a trusted-publishing job after `release`
  # when the PyPI project and GitHub environment are configured.
