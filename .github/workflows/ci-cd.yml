name: CI/CD

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check version consistency
        if: runner.os == 'Linux'
        run: make check-version

      - name: Format check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l *.go cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        shell: bash
        run: |
          MODULE="$(go list -m)"
          go build -trimpath \
            -ldflags "-X ${MODULE}/internal/commands.defaultUpdateRepo=${GITHUB_REPOSITORY}" \
            -o goskill \
            .

  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff check
        run: python -m ruff check setup.py src

      - name: Ruff format check
        run: python -m ruff format --check setup.py src
